name: Workflows CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black pylint pytest

    - name: Run format
      run: |
        cd makefile-python
        make format || true

    - name: Run lint
      run: |
        cd makefile-python
        make lint || true

    - name: Run tests
      run: |
        cd makefile-python
        make test || true
